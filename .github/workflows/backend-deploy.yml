name: Deploy Backend (Azure App Service)

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd/**'
      - '.github/workflows/backend-deploy.yml'

env:
  AZURE_WEBAPP_NAME: hometutor-api        # Adjust if using a different App Service name
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'BackEnd/HomeTutorAPI/HomeTutorAPI.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

      - name: Smoke test health endpoint
        run: |
          sleep 20
          curl --fail https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || exit 1
